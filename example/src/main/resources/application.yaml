server:
  port: 8880

spring:
  application:
    name: example
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5432/filekit
    username: filekit
    password: filekit
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    force-path-style: ${S3_FORCE_PATH_STYLE:true}
